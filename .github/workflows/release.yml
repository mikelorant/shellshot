name: release

# A v* tag builds the archives, drafts a GitHub Release and pushes the container image.
# A manual run is a dry run: the same builds, the archives kept as a workflow artifact, nothing published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in step with ZIG_VERSION in the Dockerfile and ci.yml. The ghostty submodule needs 0.17.x.
  ZIG_VERSION: 0.17.1

jobs:
  # One job per target, all in parallel, each with its own cache entry. The libraries do not depend on
  # the machine that builds them (zig cross-compiles every target with a fixed baseline CPU, and
  # libghostty-vt needs only libc), so every target is built on Linux, the cheaper runner. The same key
  # format is used by ci.yml and by the archives job below: change all three together.
  libs:
    name: libghostty (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-gnu.2.28, goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { target: aarch64-linux-gnu.2.28, goos: linux, goarch: arm64, runner: ubuntu-latest }
          - { target: x86_64-macos, goos: darwin, goarch: amd64, runner: ubuntu-latest }
          - { target: aarch64-macos, goos: darwin, goarch: arm64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7

      - name: Find the libghostty pin
        id: pin
        run: echo "commit=$(git rev-parse HEAD:third_party/ghostty)" >> "$GITHUB_OUTPUT"

      - name: Restore the libghostty cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: build/libghostty-${{ matrix.goos }}-${{ matrix.goarch }}
          key: libghostty-${{ matrix.goos }}-${{ matrix.goarch }}-zig${{ env.ZIG_VERSION }}-${{ steps.pin.outputs.commit }}

      - uses: mlugg/setup-zig@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install pkg-config
        if: steps.cache.outputs.cache-hit != 'true'
        run: command -v pkg-config >/dev/null || sudo apt-get install -y --no-install-recommends pkg-config

      # The script also fetches the ghostty submodule (only that one, shallow).
      - name: Build libghostty for ${{ matrix.target }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/build-libghostty.sh ${{ matrix.target }}

      # Saved right after the build so that a later failure cannot lose the work.
      - name: Save the libghostty cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/libghostty-${{ matrix.goos }}-${{ matrix.goarch }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  archives:
    name: archives
    needs: libs
    # The darwin targets need the macOS SDK, so the whole release is built on a Mac.
    runs-on: macos-latest
    permissions:
      contents: write # creates the draft release and uploads the archives
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog and the version come from the tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install pkg-config
        run: command -v pkg-config >/dev/null || brew install pkgconf

      - name: Find the libghostty pin
        id: pin
        run: echo "commit=$(git rev-parse HEAD:third_party/ghostty)" >> "$GITHUB_OUTPUT"

      # The libs job built and cached these. A miss here means an entry was evicted or deleted since:
      # rerun the workflow so the libs job rebuilds it.
      - name: Restore libghostty (linux-amd64)
        uses: actions/cache/restore@v6
        with:
          path: build/libghostty-linux-amd64
          key: libghostty-linux-amd64-zig${{ env.ZIG_VERSION }}-${{ steps.pin.outputs.commit }}
          fail-on-cache-miss: true

      - name: Restore libghostty (linux-arm64)
        uses: actions/cache/restore@v6
        with:
          path: build/libghostty-linux-arm64
          key: libghostty-linux-arm64-zig${{ env.ZIG_VERSION }}-${{ steps.pin.outputs.commit }}
          fail-on-cache-miss: true

      - name: Restore libghostty (darwin-amd64)
        uses: actions/cache/restore@v6
        with:
          path: build/libghostty-darwin-amd64
          key: libghostty-darwin-amd64-zig${{ env.ZIG_VERSION }}-${{ steps.pin.outputs.commit }}
          fail-on-cache-miss: true

      - name: Restore libghostty (darwin-arm64)
        uses: actions/cache/restore@v6
        with:
          path: build/libghostty-darwin-arm64
          key: libghostty-darwin-arm64-zig${{ env.ZIG_VERSION }}-${{ steps.pin.outputs.commit }}
          fail-on-cache-miss: true

      # The .pc files hold the absolute prefix of the build, so point them at this workspace
      # (a cache restored under another path would otherwise leave them pointing nowhere).
      - name: Check the libghostty pkg-config files
        run: |
          for dir in build/libghostty-*; do
            sed -i.bak "s|^prefix=.*|prefix=$GITHUB_WORKSPACE/$dir|" "$dir"/lib/pkgconfig/*.pc
            rm -f "$dir"/lib/pkgconfig/*.bak
            PKG_CONFIG_PATH="$GITHUB_WORKSPACE/$dir/lib/pkgconfig" pkg-config --exists libghostty-vt-static || { echo "::error::libghostty-vt-static not found in $dir: the libghostty cache is stale, delete it and rerun"; exit 1; }
          done

      - name: Find the macOS SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: GoReleaser (release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PWD: ${{ github.workspace }}

      - name: GoReleaser (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean
        env:
          PWD: ${{ github.workspace }}

      - uses: actions/upload-artifact@v7
        with:
          name: archives
          path: |
            dist/*.tar.gz
            dist/checksum.txt
          if-no-files-found: error
          retention-days: 14

  image:
    name: container image
    needs: archives
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes ghcr.io/<owner>/<repo> on tags
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: archives
          path: dist

      - name: Stage the binaries from the archives
        run: |
          (cd dist && sha256sum -c checksum.txt)
          for arch in amd64 arm64; do
            mkdir -p "dist/context/linux/$arch"
            tar -xzf dist/shellshot_*_linux_"$arch".tar.gz -C "dist/context/linux/$arch" shellshot
          done
          cp LICENSE NOTICE dist/context/
          ls -l dist/context/linux/*/shellshot

      # The image only copies prebuilt binaries, but its useradd step runs in the arm64 image.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.licenses=MIT
          # On a stable tag: 1.2.3, 1.2 and latest. A prerelease tag gets only 1.2.3-rc.1. Otherwise sha-<short>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short,enable=${{ env.PUSH != 'true' }}

      - name: Build the native image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: dist/context
          file: Dockerfile.release
          platforms: linux/amd64
          load: true
          provenance: false
          tags: shellshot:smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Smoke test
        run: |
          set -eu
          dir="$(mktemp -d)"
          chmod 777 "$dir"
          run="docker run --rm --user 1000:1000 -v $dir:/work shellshot:smoke"
          $run version
          $run record -o smoke.shot -c 'echo hi'
          $run export smoke.shot -o smoke.png
          file "$dir/smoke.png" | tee /dev/stderr | grep -q 'PNG image data'

      - name: Build the multi-arch image (pushed on tags)
        uses: docker/build-push-action@v7
        with:
          context: dist/context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
