name: release

# A v* tag builds the archives, drafts a GitHub Release and pushes the container image.
# A manual run is a dry run: the same builds, the archives kept as a workflow artifact, nothing published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in step with ZIG_VERSION in the Dockerfile and ci.yml. The ghostty submodule needs 0.17.x.
  ZIG_VERSION: 0.17.1

jobs:
  archives:
    name: archives
    # The darwin targets need the macOS SDK, so the whole release is built on a Mac.
    runs-on: macos-latest
    permissions:
      contents: write # creates the draft release and uploads the archives
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog and the version come from the tags

      - name: Fetch the ghostty submodule
        run: git submodule update --init --depth 1 third_party/ghostty

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install pkg-config
        run: command -v pkg-config >/dev/null || brew install pkgconf

      - name: Find the libghostty pin
        id: pin
        run: echo "commit=$(git rev-parse HEAD:third_party/ghostty)" >> "$GITHUB_OUTPUT"

      - name: Cache the four libghostty builds
        id: libs
        uses: actions/cache@v6
        with:
          path: build/libghostty-*
          key: release-libs-${{ runner.os }}-${{ runner.arch }}-zig${{ env.ZIG_VERSION }}-${{ steps.pin.outputs.commit }}

      - name: Build libghostty for the four targets
        if: steps.libs.outputs.cache-hit != 'true'
        run: make release-libs

      - name: Find the macOS SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: GoReleaser (release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PWD: ${{ github.workspace }}

      - name: GoReleaser (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean
        env:
          PWD: ${{ github.workspace }}

      - uses: actions/upload-artifact@v7
        with:
          name: archives
          path: |
            dist/*.tar.gz
            dist/checksum.txt
          if-no-files-found: error
          retention-days: 14

  image:
    name: container image
    needs: archives
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes ghcr.io/<owner>/<repo> on tags
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: archives
          path: dist

      - name: Stage the binaries from the archives
        run: |
          (cd dist && sha256sum -c checksum.txt)
          for arch in amd64 arm64; do
            mkdir -p "dist/context/linux/$arch"
            tar -xzf dist/shellshot_*_linux_"$arch".tar.gz -C "dist/context/linux/$arch" shellshot
          done
          cp LICENSE NOTICE dist/context/
          ls -l dist/context/linux/*/shellshot

      # The image only copies prebuilt binaries, but its useradd step runs in the arm64 image.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.licenses=MIT
          # On a stable tag: 1.2.3, 1.2 and latest. A prerelease tag gets only 1.2.3-rc.1. Otherwise sha-<short>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short,enable=${{ env.PUSH != 'true' }}

      - name: Build the native image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: dist/context
          file: Dockerfile.release
          platforms: linux/amd64
          load: true
          provenance: false
          tags: shellshot:smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Smoke test
        run: |
          set -eu
          dir="$(mktemp -d)"
          chmod 777 "$dir"
          run="docker run --rm --user 1000:1000 -v $dir:/work shellshot:smoke"
          $run version
          $run record -o smoke.shot -c 'echo hi'
          $run export smoke.shot -o smoke.png
          file "$dir/smoke.png" | tee /dev/stderr | grep -q 'PNG image data'

      - name: Build the multi-arch image (pushed on tags)
        uses: docker/build-push-action@v7
        with:
          context: dist/context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
