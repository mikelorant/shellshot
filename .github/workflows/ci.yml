name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with ZIG_VERSION in the Dockerfile and release.yml. The ghostty submodule needs 0.17.x.
  ZIG_VERSION: 0.17.1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      # Submodules are fetched below, and only ghostty: apple-emoji-ttf is not needed to build.
      - uses: actions/checkout@v7

      - name: Fetch the ghostty submodule
        run: git submodule update --init --depth 1 third_party/ghostty

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install pkg-config
        run: command -v pkg-config >/dev/null || { if [ "$RUNNER_OS" = macOS ]; then brew install pkgconf; else sudo apt-get install -y --no-install-recommends pkg-config; fi; }

      - name: Find the libghostty pin
        id: pin
        run: echo "commit=$(git rev-parse HEAD:third_party/ghostty)" >> "$GITHUB_OUTPUT"

      - name: Cache libghostty
        id: libghostty
        uses: actions/cache@v6
        with:
          path: build/libghostty
          key: libghostty-${{ runner.os }}-${{ runner.arch }}-zig${{ env.ZIG_VERSION }}-${{ steps.pin.outputs.commit }}

      - name: Build libghostty
        if: steps.libghostty.outputs.cache-hit != 'true'
        run: make deps

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 -race ./...

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: README image is up to date
        run: make check-showcase

  release-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
